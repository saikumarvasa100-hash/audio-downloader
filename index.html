<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Audio Downloader — paste a link, get MP3</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #111; }
  h1 { font-size: 1.6rem; }
  p.sub { color: #555; margin-top: -8px; }
  .row { display: flex; gap: 8px; margin-top: 16px; }
  input { flex: 1; padding: 12px; font-size: 1rem; border: 1px solid #ccc; border-radius: 8px; min-width: 0; }
  button { padding: 12px 18px; font-size: 1rem; border: 0; border-radius: 8px; background: #111; color: #fff; cursor: pointer; white-space: nowrap; }
  button:disabled { opacity: .5; cursor: default; }
  #status { margin-top: 16px; color: #555; min-height: 1.5em; }
  #result { margin-top: 12px; display: none; border: 1px solid #e2e2e2; border-radius: 10px; padding: 14px; }
  audio { width: 100%; margin-top: 8px; }
  a.dl { display: inline-block; margin-top: 10px; padding: 12px 18px; background: #0a7d2c; color: #fff; border-radius: 8px; text-decoration: none; font-weight: 600; }
  .fallback { margin-top: 12px; display: none; background: #eef6ff; border: 1px solid #b9d6f5; border-radius: 10px; padding: 14px; }
  code { background: #f2f2f2; padding: 2px 6px; border-radius: 6px; }
  footer { margin-top: 28px; color: #888; font-size: .85rem; }
  ol { padding-left: 20px; }
</style>
</head>
<body>
  <h1>🎧 Audio Downloader</h1>
  <p class="sub">Paste a link, get the audio as MP3. No install.</p>

  <div class="row">
    <input id="url" type="url" placeholder="Paste link here… (https://…)" autocomplete="off" />
    <button id="go">Get audio</button>
  </div>
  <div id="status"></div>

  <div id="result">
    <strong>Ready ✅</strong>
    <audio id="player" controls></audio><br />
    <a id="dl" class="dl" href="#" download>⬇ Download audio</a>
  </div>

  <div id="fallback" class="fallback"></div>

  <footer>
    Direct audio links download instantly, right here. Video links (YouTube etc.)
    are converted by a free bot — takes about a minute, needs a free GitHub login.
  </footer>

<script>
const $ = id => document.getElementById(id);
const DIRECT_RE = /\.(mp3|m4a|aac|wav|opus|ogg|flac|wma)(\?|#|$)/i;
const REPO = "https://github.com/saikumarvasa100-hash/audio-downloader";

function fileNameFromUrl(u, fallback) {
  try {
    const p = new URL(u).pathname.split("/").pop() || fallback;
    return decodeURIComponent(p).split("?")[0] || fallback;
  } catch { return fallback; }
}

function showAudio(src, filename) {
  $("player").src = src;
  const a = $("dl");
  a.href = src;
  a.setAttribute("download", filename);
  $("result").style.display = "block";
}

async function handleDirect(url) {
  const name = fileNameFromUrl(url, "audio.mp3");
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    showAudio(URL.createObjectURL(await res.blob()), name);
  } catch (e) {
    // CORS-blocked hosts can't be fetched, but the browser can still play/download them directly.
    showAudio(url, name);
    $("status").textContent = "Note: this host blocks in-page fetching, playing the original link directly.";
    return;
  }
  $("status").textContent = "Done!";
}

function showRequestButton(url) {
  $("status").textContent = "Video link detected.";
  const f = $("fallback");
  const issueUrl = REPO + "/issues/new?template=audio-request.yml&link=" + encodeURIComponent(url);
  f.innerHTML =
    "<strong>Get the MP3 in about a minute:</strong>" +
    "<ol><li>Click the button below (opens GitHub, free login).</li>" +
    "<li>Press <strong>Submit new issue</strong> — your link is already filled in.</li>" +
    "<li>A bot replies on that page with your <strong>MP3 download link</strong>.</li></ol>" +
    "<a class='dl' target='_blank' rel='noopener' href='" + issueUrl + "'>⬇ Get MP3</a>";
  f.style.display = "block";
}

$("go").addEventListener("click", async () => {
  const url = $("url").value.trim().replace(/^['"]+|['"]+$/g, "");
  $("result").style.display = "none";
  $("fallback").style.display = "none";
  if (!/^https?:\/\//i.test(url)) {
    $("status").textContent = "Paste a full link starting with https://";
    return;
  }
  $("go").disabled = true;
  $("status").textContent = "Working…";
  try {
    if (DIRECT_RE.test(url.split("?")[0].split("#")[0])) {
      await handleDirect(url);
    } else {
      showRequestButton(url);
    }
  } finally {
    $("go").disabled = false;
  }
});

$("url").addEventListener("keydown", e => { if (e.key === "Enter") $("go").click(); });
</script>
</body>
</html>
