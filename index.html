<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Audio Downloader — paste a link, get the audio</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #111; }
  h1 { font-size: 1.6rem; }
  p.sub { color: #555; margin-top: -8px; }
  .row { display: flex; gap: 8px; margin-top: 16px; }
  input { flex: 1; padding: 12px; font-size: 1rem; border: 1px solid #ccc; border-radius: 8px; min-width: 0; }
  button { padding: 12px 18px; font-size: 1rem; border: 0; border-radius: 8px; background: #111; color: #fff; cursor: pointer; white-space: nowrap; }
  button:disabled { opacity: .5; cursor: default; }
  #status { margin-top: 16px; color: #555; min-height: 1.5em; }
  #result { margin-top: 12px; display: none; border: 1px solid #e2e2e2; border-radius: 10px; padding: 14px; }
  audio { width: 100%; margin-top: 8px; }
  a.dl { display: inline-block; margin-top: 10px; padding: 12px 18px; background: #0a7d2c; color: #fff; border-radius: 8px; text-decoration: none; font-weight: 600; }
  footer { margin-top: 28px; color: #888; font-size: .85rem; }
</style>
</head>
<body>
  <h1>🎧 Audio Downloader</h1>
  <p class="sub">Paste a direct audio link, get the file. No install, no login.</p>

  <div class="row">
    <input id="url" type="url" placeholder="Paste audio link here… (https://…mp3)" autocomplete="off" />
    <button id="go">Download</button>
  </div>
  <div id="status"></div>

  <div id="result">
    <strong>Ready ✅</strong>
    <audio id="player" controls></audio><br />
    <a id="dl" class="dl" href="#" download>⬇ Download audio</a>
  </div>

  <footer>
    Works with direct audio files (.mp3, .m4a, .wav, .ogg, .opus, .flac…).
    For video links (YouTube etc.), use the computer script:
    <a href="https://github.com/saikumarvasa100-hash/audio-downloader">GitHub repo</a>.
    <br /><span style="font-size:.75rem">v4 · direct links only</span>
  </footer>

<script>
const $ = id => document.getElementById(id);
const AUDIO_EXT = /\.(mp3|m4a|aac|wav|opus|ogg|flac|wma)(\?|#|$)/i;

function fileNameFromUrl(u, fallback) {
  try {
    const p = new URL(u).pathname.split("/").pop() || fallback;
    return decodeURIComponent(p).split("?")[0] || fallback;
  } catch { return fallback; }
}

function offerDownload(blob, filename) {
  const src = URL.createObjectURL(blob);
  $("player").src = src;
  const a = $("dl");
  a.href = src;
  a.setAttribute("download", filename);
  $("result").style.display = "block";
  $("status").textContent = "Done!";
}

$("go").addEventListener("click", async () => {
  const url = $("url").value.trim().replace(/^['"]+|['"]+$/g, "");
  $("result").style.display = "none";
  if (!/^https?:\/\//i.test(url)) {
    $("status").textContent = "Paste a full link starting with https://";
    return;
  }
  const looksAudio = AUDIO_EXT.test(url.split("?")[0].split("#")[0]);
  $("go").disabled = true;
  $("status").textContent = "Downloading…";
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const type = (res.headers.get("content-type") || "").toLowerCase();
    const blob = await res.blob();
    const isAudio = type.startsWith("audio/") || type.includes("ogg") || type.includes("mpeg") ||
      blob.type.startsWith("audio/") || looksAudio;
    if (!isAudio) {
      $("status").textContent = "That's a video/web page, not an audio file — this page only downloads direct audio links (.mp3 etc.). For video links, use the computer script from the GitHub repo.";
      return;
    }
    offerDownload(blob, fileNameFromUrl(url, "audio.mp3"));
  } catch (e) {
    if (looksAudio) {
      // Host blocks in-page fetching; let the browser handle the file URL itself.
      const name = fileNameFromUrl(url, "audio.mp3");
      $("player").src = url;
      const a = $("dl");
      a.href = url;
      a.setAttribute("download", name);
      $("result").style.display = "block";
      $("status").textContent = "Done! (opened original file directly)";
    } else {
      $("status").textContent = "Couldn't download that link. If it's a video page (YouTube etc.), this page can't convert it — paste a direct audio file link instead, or use the computer script for video links.";
    }
  } finally {
    $("go").disabled = false;
  }
});

$("url").addEventListener("keydown", e => { if (e.key === "Enter") $("go").click(); });
</script>
</body>
</html>
